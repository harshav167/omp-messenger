services:
  mesh:
    build:
      context: ..
      dockerfile: mesh/Dockerfile
    ports:
      - "8765:8765"
    environment:
      OMP_MESSENGER_MESH_TOKEN: ${OMP_MESSENGER_MESH_TOKEN:?set OMP_MESSENGER_MESH_TOKEN}
    volumes:
      - mesh-data:/data
    restart: unless-stopped
volumes:
  mesh-data: {}
